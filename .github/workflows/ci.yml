name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run on main = test + deploy (the deploy job below).
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
      DATABASE_URL_SYNC: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel
      REDIS_URL: redis://localhost:6379/0
      # CI-only test key (not a production secret) — must be a valid Fernet
      # key: urlsafe-base64-encoded 32 raw bytes, e.g. via
      # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`.
      # A base64-encoded arbitrary string is NOT valid here; it must decode
      # to exactly 32 bytes.
      KMS_MASTER_KEY: CdxGT5SGJec4JFxiTg5aCyVeph5a2eq6RftjyER5SV0=
      API_SECRET_KEY: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Install Playwright Chromium
        run: uv run --package sentinel-auth playwright install --with-deps chromium

      - name: Licence check (blocks GPL/AGPL — see ADR-0002)
        run: uv run python infra/scripts/licence_check.py

      - name: Ruff lint
        run: uv run ruff check apps packages

      - name: mypy
        run: uv run mypy apps packages

      - name: Run DB migrations
        run: uv run --package sentinel-db alembic -c packages/db/alembic.ini upgrade head

      - name: Unit tests
        run: uv run pytest -m "not integration and not benchmark" -v

      - name: Integration tests
        run: uv run pytest -m integration -v

  container-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t sentinel-api:ci .
      - name: Build worker image
        run: docker build -f infra/docker/Dockerfile.worker -t sentinel-worker:ci .

  # Deploys to the shared Hetzner box (https://<SITE_DOMAIN>/security) once
  # both jobs above pass — only for main (a push, or "Run workflow" on main),
  # never for pull requests. Lives in this file rather than a separate
  # workflow_run workflow so it's guaranteed to trigger. See infra/deploy/README.md.
  deploy:
    needs: [lint-and-test, container-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Never run two deploys at once; a newer one waits for the running one.
    concurrency:
      group: deploy-hetzner-sentinel
      cancel-in-progress: false
    env:
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'accsysn.duckdns.org' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy host
        id: resolve_host
        env:
          RAW_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          python - <<'PY'
          import ipaddress
          import json
          import os
          import sys
          import urllib.request

          raw_host = (os.environ.get("RAW_HOST") or "").strip()
          if not raw_host:
              print("HETZNER_HOST secret is empty.", file=sys.stderr)
              sys.exit(1)

          host = raw_host
          if "://" in host:
              host = host.split("://", 1)[1]
          host = host.split("/", 1)[0]
          if ":" in host:
              host = host.split(":", 1)[0]
          host = host.strip()

          try:
              ipaddress.ip_address(host)
              resolved_host = host
          except ValueError:
              urls = [
                  (
                      f"https://dns.google/resolve?name={host}&type=A",
                      {"Accept": "application/json"},
                  ),
                  (
                      f"https://cloudflare-dns.com/dns-query?name={host}&type=A",
                      {"Accept": "application/dns-json"},
                  ),
              ]
              resolved_host = None
              errors = []

              for url, headers in urls:
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=10) as response:
                          payload = json.load(response)
                      for answer in payload.get("Answer") or []:
                          candidate = str(answer.get("data") or "").strip()
                          try:
                              ipaddress.ip_address(candidate)
                              resolved_host = candidate
                              break
                          except ValueError:
                              continue
                      if resolved_host:
                          break
                  except Exception as exc:
                      errors.append(f"{url}: {exc}")

              if not resolved_host:
                  print(
                      f"Unable to resolve HETZNER_HOST '{host}'. Errors: {' | '.join(errors)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"host={resolved_host}\n")
          PY

      - name: Build images
        run: |
          docker build -f infra/docker/Dockerfile.api -t sentinel-api:latest .
          docker build -f infra/docker/Dockerfile.worker -t sentinel-worker:latest .
          # Same-origin API behind the proxy: relative base, no CORS round-trip.
          docker build -f infra/docker/Dockerfile.web \
            --build-arg NEXT_PUBLIC_BASE_PATH=/security \
            --build-arg NEXT_PUBLIC_API_BASE=/security/api \
            -t sentinel-web:latest .

      - name: Bundle images and deploy files
        run: |
          mkdir -p deploy-bundle
          docker save sentinel-api:latest sentinel-worker:latest sentinel-web:latest \
            | gzip > deploy-bundle/sentinel-images.tar.gz
          cp infra/deploy/docker-compose.prod.yml infra/deploy/remote-deploy.sh deploy-bundle/
          cp -r infra/deploy/edge deploy-bundle/edge
          ls -lh deploy-bundle

      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_host.outputs.host }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "deploy-bundle/*"
          strip_components: 1
          target: "/opt/sentinel"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        # The app secrets below are optional: when unset, remote-deploy.sh
        # generates them on first deploy and keeps them in /opt/sentinel/.secrets.
        env:
          KMS_MASTER_KEY: ${{ secrets.KMS_MASTER_KEY }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Password for https://<domain>/security. Optional: when unset, one is
          # generated on the server (read it with: grep DASHBOARD_PASSWORD /opt/sentinel/.secrets).
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
        with:
          host: ${{ steps.resolve_host.outputs.host }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 20m
          envs: KMS_MASTER_KEY,API_SECRET_KEY,POSTGRES_PASSWORD,ANTHROPIC_API_KEY,DASHBOARD_PASSWORD,DASHBOARD_USER,SITE_DOMAIN
          script: bash /opt/sentinel/remote-deploy.sh
