[project]
name = "sentinel-worker"
version = "0.1.0"
description = "Celery workers: walks the scan state machine, runs each phase."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
    "sentinel-db",
    "sentinel-recon",
    "sentinel-auth",
    "sentinel-crawler",
    "sentinel-checks",
    "sentinel-reporter",
    "celery[redis]>=5.4",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_worker_app"]
