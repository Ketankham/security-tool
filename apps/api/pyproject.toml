[project]
name = "sentinel-api"
version = "0.1.0"
description = "FastAPI control plane: orgs, targets, personas, scans, findings, billing."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
    "sentinel-db",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
