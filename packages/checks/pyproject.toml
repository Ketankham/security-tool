[project]
name = "sentinel-checks"
version = "0.1.0"
description = "Passive/config, injection, authz, session-management and (v1.5) business-logic checks. Roadmap: M2-M3 (docs/03-check-catalogue.md)."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_checks"]
