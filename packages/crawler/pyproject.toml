[project]
name = "sentinel-crawler"
version = "0.1.0"
description = "Multi-persona authenticated crawler (Playwright) + JS endpoint extraction. Roadmap: M1 (docs/05-v1-roadmap.md)."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_crawler"]
