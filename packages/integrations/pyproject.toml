[project]
name = "sentinel-integrations"
version = "0.1.0"
description = "Jira/Linear/GitHub/Slack/webhook delivery. Roadmap: M3."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_integrations"]
