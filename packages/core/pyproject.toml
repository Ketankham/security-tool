[project]
name = "sentinel-core"
version = "0.1.0"
description = "Shared substrate: HTTP engine, scope guard, rate limiter, transcript recorder, state machine, crypto."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "redis>=5.0",
    "cryptography>=42.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_core"]
