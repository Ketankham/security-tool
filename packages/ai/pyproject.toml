[project]
name = "sentinel-ai"
version = "0.1.0"
description = "LLMClient abstraction (Anthropic primary), model routing, prompt templates, per-scan token budget enforcement, golden-set evals. Roadmap: M0-M2 (ADR-0001)."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_ai"]
