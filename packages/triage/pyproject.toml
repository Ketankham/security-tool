[project]
name = "sentinel-triage"
version = "0.1.0"
description = "Fingerprint-based dedup, root-cause clustering, CVSS scoring. Roadmap: M2."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_triage"]
