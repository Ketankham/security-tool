[project]
name = "sentinel-db"
version = "0.1.0"
description = "Data model (SQLAlchemy) and migrations (Alembic) for the control plane."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_db"]
