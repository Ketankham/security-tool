[project]
name = "sentinel-verifier"
version = "0.1.0"
description = "Deterministic re-proof gate: every candidate finding is independently re-executed >=2x before confidence=confirmed. Roadmap: M2."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_verifier"]
