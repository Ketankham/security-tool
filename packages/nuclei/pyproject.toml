[project]
name = "sentinel-nuclei"
version = "0.1.0"
description = "Wrapper + result normaliser for the nuclei community template runner (MIT, invoked as a subprocess — see ADR-0002). Roadmap: M3."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_nuclei"]
