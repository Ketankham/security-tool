[project]
name = "sentinel-auth"
version = "0.1.0"
description = "Persona sessions, AI-assisted LoginRecipe recording + deterministic replay, session & access oracles. Roadmap: M1."
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_auth"]
